# fix_xpt INI example — SPC/Ew water with Yeh-Hummer FSC
#
# Usage in LAMMPS input deck:
#   fix mythermo water xpt output spcew_water input spcew_water.2pt.ini
#
# All fields are optional EXCEPT nevery and nframes.  Boolean flags accept
# 1/0, true/false, yes/no, or on/off.  Comments start with '#' or ';'.

# ── Required: sampling cadence ────────────────────────────────────────────
# Example uses a short window so the demo input deck completes quickly.
# For a production run, use 10000 frames
# (40 ps per window at 4-fs sampling)
nevery     = 4          # sample every 4 timesteps (e.g. every 4 fs at dt=1 fs)
nframes    = 2500       # window length: 4·2500 = 10 ps per analysis window

# ── Output options ────────────────────────────────────────────────────────
normalize  = 1          # extensive quantities → per molecule (molecular mode)
classical  = 1          # write classical thermo columns alongside quantum
show_split = 0          # do NOT write gas/solid split columns

# ── 2PT mode (1PT/2PT/3PT taxonomy) ────────────────────────────────────────
mode       = 2PT        # 1PT = all-solid harmonic baseline (diagnostic)
                        # 2PT = gas + solid HS partition (pick `refinement`)
                        # 3PT = 2PT-rigorous + parameter-free cage (gas|cage|solid)
refinement = rigorous   # rigorous (default) | lin2003 (+lnZ) | desjarlais | r2pt
# r2pt_delta = 1.5      # Sun 2017 δ (only consulted when refinement = r2pt)

# ── Molecular decomposition ───────────────────────────────────────────────
molecule   = 1          # S = S_trans + S_rot + S_vib decomposition
symmetry   = C2v        # point group (water); sigma_rot = 2 auto-derived
linear     = 0          # 1 = linear molecule, 0 = nonlinear

# ── HS-EOS μ overshoot mitigation (optional) ──────────────────────────────
# When 1, the gas-PV term in μ_q uses Z_sim = P·V/(N·kB·T) from the LAMMPS
# virial instead of Z_CS / Z_BMCSL.  Recommended for dense fluids at η > 0.5
# where HS-EOS systematically overshoots Z.  Affects μ_q only (not S/A/E).
# Validated against onsager use_sim_z (commit e5d220b).
use_sim_z  = 0          # 0 = HS-EOS Z (default), 1 = sim virial Z
